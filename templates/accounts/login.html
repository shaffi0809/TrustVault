
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | TrustVault</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            color: #172033;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px #17203312;
        }
        h1 { color: #245eb5; margin-bottom: 8px; }
        p { color: #687386; line-height: 1.5; }
        label { display: block; margin: 20px 0 8px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dce7;
            border-radius: 7px;
            font-size: 15px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            background: #286fd1;
            color: white;
            border: 0;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }
        .error { color: #c62828; }
        .brand { font-weight: bold; font-size: 20px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand">TrustVault</div>
        <h1>Welcome back</h1>
        <p>Sign in to access your documents securely.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="username">Username</label>
            <input id="username" name="username"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password"
                   autocomplete="current-password" required>

            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
